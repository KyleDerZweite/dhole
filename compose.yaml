name: dhole

services:
  dhole:
    image: localhost/dhole:local
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    user: "1000:1000"
    userns_mode: keep-id:uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    healthcheck:
      # node:http preserves Host; Node fetch replaces it with the loopback host.
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:4173/api/health', { headers: { host: new URL(process.env.DHOLE_PUBLIC_ORIGIN).host }, timeout: 4000 }, r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1)).on('timeout', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      NODE_ENV: production
      DHOLE_HOST: 0.0.0.0
      DHOLE_PORT: "4173"
      DHOLE_DATABASE: /app/data/dhole.db
      DHOLE_DEMO: "false"
      DHOLE_AUTH_MODE: password
      DHOLE_BOOTSTRAP_TOKEN: ${DHOLE_BOOTSTRAP_TOKEN:?Set the one-time native account bootstrap token}
      DHOLE_PUBLIC_ORIGIN: ${DHOLE_PUBLIC_ORIGIN:?Set the public HTTPS origin}
      DHOLE_ALLOWED_HOSTS: ${DHOLE_ALLOWED_HOSTS:?Set the public hostname}
      DHOLE_MASTER_KEY_ID: ${DHOLE_MASTER_KEY_ID:?Set the active master key ID}
      DHOLE_MASTER_KEYS: ${DHOLE_MASTER_KEYS:?Set the master key JSON}
      DHOLE_GATEWAY_ALLOWED_HOSTS: ${DHOLE_GATEWAY_ALLOWED_HOSTS:-}
      DHOLE_MODULES: ${DHOLE_MODULES:-all}
    volumes:
      - dhole-data:/app/data:U
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks: [dhole]

  newt:
    image: docker.io/fosrl/newt:1.16.0@sha256:345fdeb369be6608d82c41d70637636c78b2c04a6112ff6ec20fc21c48afc899
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      dhole:
        condition: service_healthy
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT:?Set the Pangolin endpoint}
      NEWT_ID: ${NEWT_ID:?Set the Newt site ID}
      NEWT_SECRET: ${NEWT_SECRET:?Set the Newt site secret}
      CONFIG_FILE: /tmp/newt-config.json
      HEALTH_FILE: /tmp/healthy
    healthcheck:
      test: [CMD-SHELL, "test -f /tmp/healthy"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    networks: [dhole]

networks:
  dhole:
    driver: bridge

volumes:
  dhole-data:
